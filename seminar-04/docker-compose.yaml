name: coordination-lab

services:
  # ---------- etcd ----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web UI for etcd -> http://localhost:8002
  # In the UI, add a connection with host "etcd" and port 2379
  etcd-workbench:
    image: tzfun/etcd-workbench:latest
    container_name: etcd-workbench
    ports:
      - "8002:8002"
    depends_on:
      etcd:
        condition: service_healthy

  # Demo service: writes a few keys into etcd (via the HTTP gateway) and exits
  etcd-seed:
    image: curlimages/curl:latest
    container_name: etcd-seed
    depends_on:
      etcd:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        put() {
          k=$$(printf '%s' "$$1" | base64 | tr -d '\n')
          v=$$(printf '%s' "$$2" | base64 | tr -d '\n')
          curl -s -X POST http://etcd:2379/v3/kv/put -d "{\"key\":\"$$k\",\"value\":\"$$v\"}"
          echo " <- $$1"
        }
        put /demo/greeting "hello from etcd"
        put /demo/services/api/url "http://api:8080"
        put /demo/services/worker/url "http://worker:9000"
        put /demo/config/log_level "debug"
        put /demo/config/feature_x "true"

  # ---------- ZooKeeper ----------
  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,srvr,mntr,stat,conf"
    volumes:
      - zk-data:/data
      - zk-datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web UI for ZooKeeper -> http://localhost:9001 (connection string: zookeeper:2181)
  zoonavigator:
    image: elkozmon/zoonavigator:latest
    container_name: zoonavigator
    ports:
      - "9001:9000"
    environment:
      HTTP_PORT: 9000
      CONNECTION_LOCALZK_NAME: "Local ZooKeeper"
      CONNECTION_LOCALZK_CONN: "zookeeper:2181"
      AUTO_CONNECT_CONNECTION_ID: "LOCALZK"
    depends_on:
      zookeeper:
        condition: service_healthy

  # Demo service: creates a few znodes and exits
  zk-seed:
    image: zookeeper:3.9
    container_name: zk-seed
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        zkCli.sh -server zookeeper:2181 create /demo "hello from zookeeper"
        zkCli.sh -server zookeeper:2181 create /demo/services ""
        zkCli.sh -server zookeeper:2181 create /demo/services/api "http://api:8080"
        zkCli.sh -server zookeeper:2181 create /demo/services/worker "http://worker:9000"
        zkCli.sh -server zookeeper:2181 create /demo/config ""
        zkCli.sh -server zookeeper:2181 create /demo/config/log_level "debug"

volumes:
  etcd-data:
  zk-data:
  zk-datalog: