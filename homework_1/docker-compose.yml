services:
  redis:
    image: redis:8.10.2-alpine
    container_name: redis_db
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infra/redis_config/redis.conf:/usr/local/etc/redis/redis.conf
    secrets:
      - redis_users_acl
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "health_checker", "ping"]
      interval: 30s
      timeout: 10s
      retries: 15
    networks:
      - backend_network
    command: redis-server /usr/local/etc/redis/redis.conf

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    env_file:
      - prometheus_credentials.env
    volumes:
      - ./infra/prometheus_config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    secrets:
      - prometheus_users
    networks:
      - monitoring_network
    extra_hosts:
      - "host.docker.internal:host-gateway"  # for host access -- when fastapi run in venv on host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=200h"
      - "--web.config.file=/run/secrets/prometheus_users"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://$$PROMETHEUS_USER_NAME:$$PROMETHEUS_USER_PASSWORD@127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 15

  grafana:
    image: grafana/grafana:13.0
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - prometheus_credentials.env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana_config/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD", "curl", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 15

volumes:
  redis_data: null
  prometheus_data: null
  grafana_data: null

secrets:
  redis_users_acl:
    file: ./infra/redis_config/users.acl

  prometheus_users:
    file: ./infra/prometheus_config/prometheus_users.yml

networks:
  backend_network: null
  monitoring_network: null
