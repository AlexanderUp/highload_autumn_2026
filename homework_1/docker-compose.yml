services:
  redis:
    image: redis:8.10.2-alpine
    container_name: redis_db
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis_config/redis.conf:/usr/local/etc/redis/redis.conf
    secrets:
      - redis_users_acl
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user health_checker ping"]
      interval: 30s
      timeout: 10s
      retries: 15
    networks:
      - backend_network
    command: redis-server /usr/local/etc/redis/redis.conf

volumes:
  redis_data: null

secrets:
  redis_users_acl:
    file: ./redis_config/users.acl

networks:
  backend_network: null
