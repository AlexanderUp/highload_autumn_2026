apiVersion: 1

prune: true

datasources:
  - name: Prometheus
    uid: prometheus_datasource_v1
    version: 1
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: $PROMETHEUS_USER_PASSWORD
